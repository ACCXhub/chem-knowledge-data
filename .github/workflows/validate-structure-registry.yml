name: Validate structure registry

on:
  push:
    branches: [main, audit-structure-registry-v1.0.1]
    paths:
      - "packages/structure_registry/**"
      - ".github/workflows/validate-structure-registry.yml"
  pull_request:
    paths:
      - "packages/structure_registry/**"
      - ".github/workflows/validate-structure-registry.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-structure-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: packages/structure_registry/validation/requirements.txt

      - name: Install Structure Registry validation toolchain
        run: python -m pip install -r packages/structure_registry/validation/requirements.txt

      - name: Rebuild canonical Structure Registry release
        run: python packages/structure_registry/pipelines/build_release.py

      - name: Validate canonical data and cross-track coverage
        run: python packages/structure_registry/validation/validate_dataset.py --strict

      - name: Run Structure Registry unit tests
        run: python -m unittest discover -s packages/structure_registry/tests -v

      - name: Require reproducible generated data in pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- packages/structure_registry/data

      - name: Commit regenerated audit data
        if: github.event_name == 'push' && github.ref == 'refs/heads/audit-structure-registry-v1.0.1'
        shell: bash
        run: |
          git add packages/structure_registry/data
          if git diff --cached --quiet; then
            echo "Audited canonical data already matches the deterministic builder."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(structure-registry): regenerate audited release [skip ci]"
          git push
