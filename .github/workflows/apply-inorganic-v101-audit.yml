name: apply-inorganic-v101-audit

on:
  push:
    branches:
      - inorganic-v1-audit
    paths:
      - '.github/workflows/apply-inorganic-v101-audit.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inorganic-v1-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply record corrections
        run: python packages/inorganic/maintenance/apply_v101_corrections.py
      - name: Apply support updates
        run: python packages/inorganic/maintenance/apply_v101_support.py
      - name: Commit generated corrections
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/inorganic
          git commit -m 'fix(inorganic): apply v1.0.1 audit corrections'
          git push origin HEAD:inorganic-v1-audit
