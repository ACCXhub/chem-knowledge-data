name: Validate consolidated consumer release

on:
  push:
    branches: [main]
    paths:
      - "packages/inorganic/**"
      - "packages/organic/**"
      - "packages/structure_registry/**"
      - "packages/structural_chemistry/**"
      - "packages/consolidated/**"
      - ".github/workflows/validate-consolidated.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: consolidated-release-main
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Build deterministic consumer artifacts
        run: python packages/consolidated/tools/build_release.py

      - name: Validate consolidated release
        run: python packages/consolidated/validation/validate_release.py

      - name: Check whitespace
        run: git diff --check

      - name: Publish regenerated consumer artifacts
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- packages/consolidated/generated)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/consolidated/generated
            git commit -m "data(consolidated): regenerate consumer release [skip ci]"
            git push
          else
            echo "Generated consumer artifacts are already current."
          fi
