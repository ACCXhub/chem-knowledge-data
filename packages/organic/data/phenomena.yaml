phenomena:
  - id: org-phenomenon:bromine-solution-decolorization-by-alkene
    name_zh: 烯烃使溴的颜色褪去
    observation_zh: 溴水或适当溴溶液的橙棕色明显变浅直至褪去。
    interpretation_zh: 可作为碳碳双键发生加成反应的典型证据之一，但该现象并非对所有体系都具有唯一鉴别性。
    diagnostic_strength: not_unique
    reaction_refs: [org-reaction:ethene-bromine-addition]
    experiment_refs: [org-experiment:ethene-properties, org-experiment:functional-group-tests]
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-lab-guidance-2025]

  - id: org-phenomenon:bromine-solution-decolorization-by-alkyne
    name_zh: 炔烃使溴的颜色褪去
    observation_zh: 乙炔等炔烃与溴的适当溶液接触时，溴的颜色逐渐变浅直至褪去。
    interpretation_zh: 用于联系碳碳三键的不饱和性与加成反应；褪色现象本身不是炔烃的唯一鉴别证据。
    diagnostic_strength: not_unique
    reaction_refs: []
    experiment_refs: [org-experiment:ethyne-properties, org-experiment:functional-group-tests]
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-lab-guidance-2025]

  - id: org-phenomenon:ethyl-acetate-fruity-odor
    name_zh: 乙酸乙酯的典型气味
    observation_zh: 反应产物中可观察到乙酸乙酯具有典型的果香样气味特征。
    interpretation_zh: 只能作为教学实验中的辅助现象，不能单独作为纯度或身份的严格判据。
    diagnostic_strength: supporting
    reaction_refs: [org-reaction:acetic-acid-ethanol-esterification]
    experiment_refs: [org-experiment:ethyl-acetate-preparation]
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-lab-guidance-2025]

  - id: org-phenomenon:permanganate-decolorization-by-toluene-sidechain
    name_zh: 甲苯使酸性高锰酸钾褪色
    observation_zh: 酸性高锰酸钾溶液的紫色在反应过程中逐渐褪去。
    interpretation_zh: 反映苯环侧链可被强氧化剂氧化；该现象不能简单等同于碳碳双键检验。
    diagnostic_strength: not_unique
    reaction_refs: [org-reaction:toluene-sidechain-oxidation]
    experiment_refs: [org-experiment:benzene-properties]
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-hs-chem-2020]

  - id: org-phenomenon:phenol-bromine-white-precipitate
    name_zh: 苯酚与溴水产生白色沉淀
    observation_zh: 溴水褪色并出现白色沉淀。
    interpretation_zh: 高中范围内用于展示苯酚与溴水反应生成2,4,6-三溴苯酚的典型现象。
    diagnostic_strength: typical
    reaction_refs: [org-reaction:phenol-bromination]
    experiment_refs: [org-experiment:phenol-properties, org-experiment:functional-group-tests]
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-lab-guidance-2025]

  - id: org-phenomenon:fermentation-gas-evolution
    name_zh: 葡萄糖酒精发酵放出气体
    observation_zh: 发酵过程中持续产生气泡并有二氧化碳生成。
    interpretation_zh: 与葡萄糖在酶作用下转化为乙醇和二氧化碳相联系。
    diagnostic_strength: supporting
    reaction_refs: [org-reaction:glucose-fermentation]
    experiment_refs: [org-experiment:carbohydrate-properties]
    verification_status: seed
    provenance_refs: [manual-seed-2026-08]

  - id: org-phenomenon:aldehyde-silver-mirror
    name_zh: 醛基的银镜现象
    observation_zh: 在规范实验条件下，洁净容器内壁可形成银白色金属银沉积或银镜。
    interpretation_zh: 是高中醛基及具有相应还原性的葡萄糖等体系的典型现象之一，但应结合试剂状态、加热条件和样品组成判断。
    diagnostic_strength: typical
    reaction_refs: []
    experiment_refs: [org-experiment:aldehyde-properties, org-experiment:functional-group-tests, org-experiment:carbohydrate-properties]
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-hs-chem-2020, moe-lab-guidance-2025]

  - id: org-phenomenon:aldehyde-cuprous-oxide-precipitate
    name_zh: 醛基与新制氢氧化铜反应生成氧化亚铜
    observation_zh: 加热条件下可由蓝色体系形成砖红色氧化亚铜沉淀。
    interpretation_zh: 是高中范围内醛基还原性相关的典型实验现象之一；沉淀物为Cu2O而不是CuO。
    diagnostic_strength: typical
    reaction_refs: []
    experiment_refs: [org-experiment:aldehyde-properties, org-experiment:functional-group-tests, org-experiment:carbohydrate-properties]
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-lab-guidance-2025]

  - id: org-phenomenon:starch-iodine-blue
    name_zh: 淀粉遇碘显蓝色
    observation_zh: 淀粉体系加入适量碘试剂后出现特征性蓝色或蓝黑色。
    interpretation_zh: 是高中糖类实验中识别淀粉及跟踪淀粉水解程度的常用现象。
    diagnostic_strength: typical
    reaction_refs: []
    experiment_refs: [org-experiment:carbohydrate-properties]
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-lab-guidance-2025]

  - id: org-phenomenon:lipid-water-phase-separation
    name_zh: 油脂与水的分层现象
    observation_zh: 代表性油脂与水混合后通常形成彼此分离的液相或明显的非均相体系。
    interpretation_zh: 用于联系油脂的疏水性宏观表现，但不能据此区分所有具体脂质结构。
    diagnostic_strength: supporting
    reaction_refs: []
    experiment_refs: [org-experiment:lipid-properties]
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-lab-guidance-2025]

  - id: org-phenomenon:lipid-saponification-emulsifying-product
    name_zh: 油脂皂化后的表面活性表现
    observation_zh: 代表性油脂发生碱性水解后，体系中形成高级脂肪酸盐等产物，可表现出与原油脂不同的乳化或分散性质。
    interpretation_zh: 用于连接皂化反应与肥皂主要成分的结构特点，不把宏观乳化现象作为单一化合物的严格鉴定方法。
    diagnostic_strength: supporting
    reaction_refs: [org-reaction:triolein-saponification, org-reaction:tristearin-saponification]
    experiment_refs: [org-experiment:lipid-properties]
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-lab-guidance-2025]

  - id: org-phenomenon:protein-salting-out
    name_zh: 蛋白质盐析现象
    observation_zh: 在适当高浓度盐体系中，部分蛋白质的溶解度降低并从溶液中析出。
    interpretation_zh: 盐析可作为蛋白质分离性质的教学例子，应与导致蛋白质结构不可逆改变的变性现象区分。
    diagnostic_strength: typical
    reaction_refs: []
    experiment_refs: [org-experiment:protein-properties]
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-lab-guidance-2025]

  - id: org-phenomenon:protein-denaturation
    name_zh: 蛋白质变性的宏观表现
    observation_zh: 蛋白质在某些物理或化学因素作用下可能出现凝聚、沉淀或性质明显改变等现象。
    interpretation_zh: 变性涉及蛋白质高级结构和性质改变，具体表现取决于蛋白质种类及条件，不能将所有沉淀都等同为变性。
    diagnostic_strength: supporting
    reaction_refs: []
    experiment_refs: [org-experiment:protein-properties]
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-lab-guidance-2025]

  - id: org-phenomenon:protein-color-reaction
    name_zh: 蛋白质的典型颜色反应现象
    observation_zh: 在课程规定的适当定性实验条件下，某些蛋白质可出现特征性颜色变化。
    interpretation_zh: 该现象用于联系蛋白质中特定结构单元与定性实验，不作为所有蛋白质的唯一通用鉴别方法。
    diagnostic_strength: supporting
    reaction_refs: []
    experiment_refs: [org-experiment:protein-properties]
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-lab-guidance-2025]

  - id: org-phenomenon:ethanol-sodium-gas-evolution
    name_zh: 乙醇与钠反应放出气体
    observation_zh: 乙醇与钠发生反应时可观察到气体生成。
    interpretation_zh: 气体为氢气，用于联系醇羟基中的氢可被活泼金属取代；该记录不提供实验操作步骤。
    diagnostic_strength: supporting
    reaction_refs: [org-reaction:ethanol-sodium]
    experiment_refs: [org-experiment:ethanol-properties]
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-hs-chem-2020]

  - id: org-phenomenon:acetic-acid-bicarbonate-gas-evolution
    name_zh: 乙酸与碳酸氢钠反应放出二氧化碳
    observation_zh: 乙酸与碳酸氢钠反应时可观察到明显气泡。
    interpretation_zh: 气体为二氧化碳，可用于展示羧酸酸性并与醇、酚的典型性质进行比较。
    diagnostic_strength: typical
    reaction_refs: [org-reaction:acetic-acid-bicarbonate]
    experiment_refs: [org-experiment:ethanol-properties]
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-hs-chem-2020, moe-lab-guidance-2025]
