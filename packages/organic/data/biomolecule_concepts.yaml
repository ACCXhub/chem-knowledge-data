concepts:
  - id: org-concept:amino-acid-general-structure
    name_zh: 氨基酸的组成与结构特点
    category: biomolecule
    summary_zh: 高中范围内重点认识氨基酸分子中氨基、羧基等结构特征，并以甘氨酸、丙氨酸等代表物建立结构与性质联系。
    prerequisite_refs: [org-concept:functional-group]
    related_substance_refs: [org-substance:glycine, org-substance:alanine]
    teaching_priority: core
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-hs-chem-2020]

  - id: org-concept:amino-acid-properties
    name_zh: 氨基酸的主要化学性质
    category: biomolecule
    summary_zh: 从氨基和羧基等结构特征理解氨基酸的主要化学性质，不把复杂酸碱平衡或生化过程过度扩展到高中基础数据层。
    prerequisite_refs: [org-concept:amino-acid-general-structure, org-concept:functional-group]
    related_substance_refs: [org-substance:glycine, org-substance:alanine]
    teaching_priority: core
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-hs-chem-2020]

  - id: org-concept:amino-acid-amphoteric-character
    name_zh: 氨基酸的两性特点
    category: biomolecule
    summary_zh: 氨基酸同时具有可表现碱性的氨基和可表现酸性的羧基，因此高中范围内可从结构理解其两性反应特点；具体离子形态和平衡由题目条件决定。
    prerequisite_refs: [org-concept:amino-acid-general-structure, org-concept:amino-acid-properties]
    related_substance_refs: [org-substance:glycine, org-substance:alanine]
    teaching_priority: core
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-hs-chem-2020]

  - id: org-concept:peptide-bond-and-polypeptide
    name_zh: 肽键与多肽形成
    category: biomolecule
    summary_zh: 氨基酸分子可通过缩合形成肽键并逐步构成多肽，是理解蛋白质组成与人工合成多肽意义的基础关系。
    prerequisite_refs: [org-concept:amino-acid-general-structure, org-concept:condensation-polymerization]
    related_substance_refs: [org-substance:glycine, org-substance:alanine]
    teaching_priority: core
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-hs-chem-2020]

  - id: org-concept:protein-composition-structure-properties
    name_zh: 蛋白质的组成、结构与性质
    category: biomolecule
    summary_zh: 将氨基酸、多肽和蛋白质按层级联系起来，认识蛋白质结构复杂性以及结构变化与性质变化之间的关系。
    prerequisite_refs: [org-concept:peptide-bond-and-polypeptide]
    related_substance_refs: []
    teaching_priority: core
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-hs-chem-2020, moe-lab-guidance-2025]

  - id: org-concept:protein-hydrolysis
    name_zh: 蛋白质和多肽的水解
    category: biomolecule
    summary_zh: 多肽和蛋白质在适当条件下可逐步水解，最终与氨基酸单元建立联系；复杂蛋白质不被简化成一个固定分子式的单一化合物。
    prerequisite_refs: [org-concept:peptide-bond-and-polypeptide, org-concept:protein-composition-structure-properties]
    related_substance_refs: [org-substance:glycine, org-substance:alanine]
    teaching_priority: core
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-hs-chem-2020]

  - id: org-concept:protein-salting-out-and-denaturation
    name_zh: 蛋白质的盐析与变性
    category: biomolecule
    summary_zh: 区分盐析等可逆分离现象与蛋白质变性导致的结构和性质改变，避免将所有蛋白质沉淀现象视为同一过程。
    prerequisite_refs: [org-concept:protein-composition-structure-properties]
    related_substance_refs: []
    teaching_priority: core
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-lab-guidance-2025]

  - id: org-concept:protein-color-reaction
    name_zh: 蛋白质的典型颜色反应
    category: biomolecule
    summary_zh: 在高中实验语境下用适当的颜色反应作为蛋白质性质观察之一，现象具有条件依赖性，不作为所有蛋白质的唯一鉴别判据。
    prerequisite_refs: [org-concept:protein-composition-structure-properties]
    related_substance_refs: []
    teaching_priority: common
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-lab-guidance-2025]

  - id: org-concept:lipid-structure-fatty-acids
    name_zh: 油脂、甘油与高级脂肪酸的关系
    category: biomolecule
    summary_zh: 以代表性甘油三酯联系甘油与高级脂肪酸，区分油脂这一类别与具体的三油酸甘油酯、三硬脂酸甘油酯等化学实体。
    prerequisite_refs: [org-concept:esterification]
    related_substance_refs: [org-substance:glycerol, org-substance:oleic-acid, org-substance:stearic-acid, org-substance:triolein, org-substance:tristearin]
    teaching_priority: core
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-hs-chem-2020, moe-lab-guidance-2025]

  - id: org-concept:fatty-acid-unsaturation
    name_zh: 高级脂肪酸的饱和与不饱和
    category: biomolecule
    summary_zh: 通过硬脂酸与油酸等代表物联系碳链中不饱和结构与物质类别，不以常温状态等单一宏观性质作为严格结构判据。
    prerequisite_refs: [org-concept:lipid-structure-fatty-acids, org-concept:unsaturation-test]
    related_substance_refs: [org-substance:oleic-acid, org-substance:stearic-acid]
    teaching_priority: common
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-hs-chem-2020]

  - id: org-concept:lipid-hydrolysis-saponification
    name_zh: 油脂的水解与皂化
    category: biomolecule
    summary_zh: 高中范围内从酯类结构联系油脂在不同条件下的水解，并认识碱性水解生成甘油和高级脂肪酸盐的皂化关系。
    prerequisite_refs: [org-concept:ester-hydrolysis, org-concept:lipid-structure-fatty-acids]
    related_substance_refs: [org-substance:triolein, org-substance:tristearin, org-substance:glycerol, org-substance:sodium-oleate, org-substance:sodium-stearate]
    teaching_priority: core
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-lab-guidance-2025]

  - id: org-concept:nucleic-acid-overview
    name_zh: 核酸概览
    category: biomolecule
    summary_zh: 作为高中有机与生命化学衔接节点记录核酸的组成与结构复杂性，不把核酸伪装成单一固定分子式的物质实体。
    prerequisite_refs: []
    related_substance_refs: []
    teaching_priority: common
    verification_status: seed
    provenance_refs: [manual-seed-2026-08, moe-hs-chem-2020]
