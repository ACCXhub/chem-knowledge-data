policy:
  meaning_of_covered: >-
    At least one package-local entity or relation explicitly represents the curriculum item,
    and every required key is checked by validation. It does not imply enumeration of every
    possible compound or ownership of canonical molecular structure data.
  structure_details_deferred_to: packages/structure
  cross_package_species_resolution_deferred_to: consolidation
